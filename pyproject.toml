[project]
name = "pycon-kr-2026-zero-trust"
version = "1.0.0"
description = "PyCon Korea 2026 tutorial: build a zero-trust data pipeline in Python, no AWS account required."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Tristan McKinnon", email = "tristan@deterministicsystems.dev" }]
requires-python = "==3.12.*"

dependencies = [
    "boto3==1.43.65",
    "botocore==1.43.65",
    "moto[s3,sts]==5.2.2",
    "pytest==9.1.1",
]

[project.optional-dependencies]
# The finale only. Do not install before Module E — it spoils the reveal.
finale = ["pymayfly[aws]==0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutorial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import tutorial/ straight from the repo root. Means the offline install never
# needs a build backend — the four pinned wheels are the whole dependency set.
pythonpath = ["."]
# aws_integration is deselected by default. It needs a real AWS account.
# Run it deliberately: pytest -m aws_integration
addopts = "-m 'not aws_integration'"
markers = [
    "aws_integration: hits real AWS. Needs credentials. Never runs in the tutorial.",
]
